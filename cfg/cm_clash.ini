## OpenClash 订阅模板
## 使用方法：
##   1. 在 OpenClash -> 配置订阅 -> 自定义模板 中填入本文件内容
##   2. 添加你的节点订阅，订阅节点会自动注入到名为 PROXY 的策略组
##   3. 如果需自动测速切换，请在 AUTO 组中手动填入你的节点名称

mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.push.apple.com"
    - "+.googlevideo.com"
    - "+.douyin.com"
    - "+.douyincdn.com"
    - "+.douyinpic.com"
    - "+.douyinstatic.com"
    - "+.douyinliving.com"
    - "+.amemv.com"
    - "+.snssdk.com"
    - "+.byteimg.com"
    - "+.pstatp.com"
    - "+.xiaohongshu.com"
    - "+.xhscdn.com"
    - "+.xhscdn.net"
    - "+.xhslink.com"
    - "+.xhsimg.com"
tun:
  enable: true
  stack: mixed
  mtu: 1492
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true

## 节点全部由订阅提供，此处留空
proxies: []

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT
      # 订阅节点会自动注入到 PROXY 组，无需手动添加
      # 若同时有多个订阅，所有节点都会被合并至此

  - name: AUTO
    type: url-test
    proxies:
      ## ⚠️ 请将你订阅中的节点名称逐个填入下方（替换示例）
      ## 例如：- 香港01
      ##       - 日本02
      ##       - 美国03
      ## 如果你不需要自动测速，可删除整个 AUTO 组，并在 PROXY 组中直接选择
      # - 示例节点名称1
      # - 示例节点名称2
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

